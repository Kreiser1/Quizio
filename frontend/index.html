<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Quizio - Главная</title>
    </head>
    <link rel="stylesheet" href="theme.css" />
    <script src="utils.js"></script>

    <body>
        <section class="nav glass">
            <h1>Quizio</h1>
            <a href=""><h4>Главная</h4></a>
            <a href="/profile.html"><h4>Профиль</h4></a>
            <a href="/achievements.html"><h4>Достижения</h4></a>
        </section>
        <section class="profile glass">
            <a href="/profile.html"><img id="profile-avatar" class="small-picture" /></a>
            <h4 id="profile-name"></h4>
        </section>
        <section
            class="main glass"
            style="
                display: grid;
                grid-template-rows: 1fr auto;
                justify-content: stretch;
                align-items: start;
            "
        >
            <div style="overflow-x: auto">
                <label>
                    <h4>Комнаты</h4>
                </label>
                <table style="width: 100%">
                    <thead>
                        <tr>
                            <th></th>
                            <th>Название</th>
                            <th>Билет</th>
                            <th>Викторина</th>
                            <th>Владелец</th>
                            <th>Игроков</th>
                            <th>Статус</th>
                        </tr>
                    </thead>
                    <tbody id="rooms"></tbody>
                </table>
                <p class="no-select" style="color: red" id="rooms-error"></label>
            </div>
            <div
                style="
                    display: flex;
                    flex-direction: row;
                    gap: 5px;
                    align-items: center;
                    justify-content: stretch;
                "
            >
                <input type="search" id="search-query" placeholder="Поиск..." />
                <input
                    type="number"
                    min="0"
                    value=""
                    id="search-count"
                    placeholder="Количество"
                />
                <input
                    type="number"
                    min="0"
                    value=""
                    id="search-offset"
                    placeholder="Страница"
                />
                <button
                    id="create-room-btn"
                    class="success no-wrap"
                    style="display: none"
                >
                    Создать
                </button>
            </div>
        </section>
        <section
            class="side glass scroll"
            style="display: flex; flex-direction: column"
        >
            <a href="/achievements.html"><h4>Достижения</h4></a>
            <table>
                <tbody id="achievements"></tbody>
            </table>
            <p class="no-select" style="color: red" id="achievements-error"></p>
        </section>
        <script>
            
        </script>
    </body>
</html>
