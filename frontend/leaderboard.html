<!doctype html>
<html lang="en" color-scheme="dark">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Quizio - Таблица лидеров</title>

        <link rel="stylesheet" href="theme.css" />
        <script src="utils.js"></script>

        <style>
            .leaderboard-container {
                display: flex;
                flex-direction: column;
                gap: 20px;
            }

            .winner-section {
                text-align: center;
                padding: 30px;
                background: linear-gradient(
                    135deg,
                    rgba(255, 215, 0, 0.3),
                    rgba(255, 165, 0, 0.15)
                );
                border-radius: var(--border-radius-lg);
                margin-bottom: 20px;
                border: 1px solid rgba(255, 215, 0, 0.5);
            }

            .winner-avatar {
                width: 100px;
                height: 100px;
                border-radius: 50%;
                margin: 10px auto;
                border: 3px solid gold;
                object-fit: cover;
            }

            .winner-name {
                font-size: 2em;
                font-weight: bold;
                color: gold;
                margin: 10px 0;
                text-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
            }

            .winner-score {
                font-size: 1.5em;
                color: var(--success);
            }

            .crown {
                font-size: 3em;
            }

            .top-3 {
                display: flex;
                justify-content: center;
                gap: 30px;
                margin-bottom: 30px;
                flex-wrap: wrap;
            }

            .top-card {
                text-align: center;
                padding: 20px;
                border-radius: var(--border-radius);
                min-width: 180px;
                transition: transform 0.3s ease;
            }

            .top-card:hover {
                transform: translateY(-5px);
            }

            .top-card.first {
                background: linear-gradient(
                    135deg,
                    rgba(255, 215, 0, 0.25),
                    rgba(255, 165, 0, 0.15)
                );
                border: 1px solid gold;
                box-shadow: 0 0 20px rgba(255, 215, 0, 0.3);
            }

            .top-card.second {
                background: linear-gradient(
                    135deg,
                    rgba(192, 192, 192, 0.25),
                    rgba(169, 169, 169, 0.15)
                );
                border: 1px solid silver;
            }

            .top-card.third {
                background: linear-gradient(
                    135deg,
                    rgba(205, 127, 50, 0.25),
                    rgba(160, 100, 40, 0.15)
                );
                border: 1px solid #cd7f32;
            }

            .medal {
                font-size: 2.5em;
                margin-bottom: 10px;
            }

            .rank-badge {
                display: inline-block;
                width: 30px;
                height: 30px;
                line-height: 30px;
                text-align: center;
                border-radius: 50%;
                font-weight: bold;
                margin-right: 10px;
            }

            .rank-1 {
                background: linear-gradient(135deg, gold, #ffaa00);
                color: #000;
                box-shadow: 0 0 5px gold;
            }
            .rank-2 {
                background: linear-gradient(135deg, silver, #aaa);
                color: #000;
            }
            .rank-3 {
                background: linear-gradient(135deg, #cd7f32, #b5651e);
                color: #fff;
            }
            .rank-other {
                background: var(--secondary);
                color: #fff;
            }

            .user-row {
                cursor: pointer;
                transition: background-color 0.2s;
            }

            .user-row:hover {
                background-color: rgba(255, 255, 255, 0.05);
            }

            .user-row.current-user {
                background-color: rgba(16, 185, 129, 0.2);
                font-weight: bold;
            }

            .room-info {
                text-align: center;
                margin-bottom: 20px;
                padding: 15px;
                background: rgba(0, 0, 0, 0.2);
                border-radius: var(--border-radius);
            }

            .play-again-btn {
                margin-top: 30px;
                padding: 15px 30px;
                font-size: 1.2em;
            }

            .gold-text {
                color: gold;
                text-shadow: 0 0 5px rgba(255, 215, 0, 0.5);
            }

            .silver-text {
                color: silver;
            }

            .bronze-text {
                color: #cd7f32;
            }

            .avatar-img {
                object-fit: cover;
            }

            .top-card-avatar {
                width: 60px;
                height: 60px;
                border-radius: 50%;
                margin: 10px auto;
                object-fit: cover;
            }
        </style>
    </head>

    <body>
        <section class="nav glass">
            <h1>Quizio</h1>
            <a href="/"><h4>🏠 Главная</h4></a>
            <a href="/profile.html"><h4>👤 Профиль</h4></a>
            <a href="/achievements.html"><h4>🏆 Достижения</h4></a>
            <a href="/quizzes.html" id="quizzes-btn" style="display: none"
                ><h4>📚 Викторины</h4></a
            >
            <a href="/admin.html" id="admin-btn" style="display: none"
                ><h4>👑 Администрирование</h4></a
            >
        </section>

        <section class="profile glass">
            <a href="/profile.html"
                ><img id="profile-avatar" class="small-picture"
            /></a>
            <h3 id="profile-name" style="margin-left: 10px"></h3>
        </section>

        <section class="main glass leaderboard-container">
            <div class="room-info" id="room-info">
                <h2 id="room-title">Загрузка...</h2>
                <p id="room-date"></p>
            </div>

            <div id="winner-section" style="display: none">
                <div class="winner-section">
                    <div class="crown">👑</div>
                    <img id="winner-avatar" class="winner-avatar" />
                    <div class="winner-name" id="winner-name"></div>
                    <div class="winner-score" id="winner-score"></div>
                </div>
            </div>

            <div id="top-3" class="top-3" style="display: none"></div>

            <div style="overflow-x: auto">
                <h3>📊 Полная таблица</h3>
                <table style="width: 100%">
                    <thead>
                        <tr>
                            <th>#</th>
                            <th></th>
                            <th>Имя</th>
                            <th>Очки</th>
                            <th>Правильных ответов</th>
                            <th>Серия</th>
                        </tr>
                    </thead>
                    <tbody id="leaderboard-body"></tbody>
                </table>
            </div>

            <div style="display: flex; justify-content: center; gap: 20px">
                <button id="play-again-btn" class="success">
                    🎮 Играть снова
                </button>
                <button id="home-btn" class="primary">🏠 На главную</button>
            </div>

            <p
                id="error"
                style="color: crimson; text-align: center; display: none"
            ></p>
        </section>

        <section class="side glass scroll">
            <h4>📈 Статистика</h4>
            <div style="padding: 15px">
                <p>👥 Всего игроков: <strong id="total-players">0</strong></p>
                <p>⭐ Средний балл: <strong id="avg-score">0</strong></p>
                <p>🏆 Максимальный балл: <strong id="max-score">0</strong></p>
                <p>📊 Суммарный балл: <strong id="total-score">0</strong></p>
            </div>
        </section>

        <script>
            let finalRoomData = null;
            let currentUsername = "";
            let currentUserRole = "";
            let userProfiles = new Map();

            function getImageUrl(icon) {
                if (typeof icon === "number") {
                    return load_preset(`${icon}.png`);
                } else if (typeof icon === "string" && icon.length > 0) {
                    return `data:image/png;base64,${icon}`;
                }
                return null;
            }

            function getRoleColor(role) {
                return role === "administrator"
                    ? "crimson"
                    : role === "moderator"
                      ? "yellow"
                      : "greenyellow";
            }

            function fetchUserProfile(username) {
                return new Promise((resolve, reject) => {
                    if (userProfiles.has(username)) {
                        resolve(userProfiles.get(username));
                        return;
                    }

                    UsersAPI.get_user_profile(
                        username,
                        (profile) => {
                            userProfiles.set(username, profile);
                            resolve(profile);
                        },
                        (error) => {
                            console.error(
                                `Failed to load profile for ${username}:`,
                                error,
                            );
                            resolve(null);
                        },
                    );
                });
            }

            function loadProfile() {
                UsersAPI.get_profile(
                    (profile) => {
                        currentUsername = profile.username;
                        currentUserRole = profile.role;

                        const nameElement =
                            document.getElementById("profile-name");
                        nameElement.textContent =
                            profile.nickname || profile.username;
                        nameElement.style.color = getRoleColor(profile.role);

                        const avatarUrl = getImageUrl(profile.avatar);
                        const avatarElement =
                            document.getElementById("profile-avatar");
                        if (avatarUrl) {
                            avatarElement.src = avatarUrl;
                            avatarElement.onerror = () =>
                                (avatarElement.style.display = "none");
                        } else {
                            avatarElement.style.display = "none";
                        }

                        const quizzesBtn =
                            document.getElementById("quizzes-btn");
                        if (quizzesBtn) {
                            if (
                                currentUserRole === "moderator" ||
                                currentUserRole === "administrator"
                            ) {
                                quizzesBtn.style.display = "block";
                            } else {
                                quizzesBtn.style.display = "none";
                            }
                        }

                        const adminBtn = document.getElementById("admin-btn");
                        if (adminBtn) {
                            adminBtn.style.display =
                                currentUserRole === "administrator"
                                    ? "block"
                                    : "none";
                        }

                        loadLeaderboardData();
                    },
                    (error) => {
                        console.error("Failed to load profile:", error);
                        loadLeaderboardData();
                    },
                );
            }

            function loadLeaderboardData() {
                const storedData = sessionStorage.getItem("finalRoomData");

                if (!storedData) {
                    document.getElementById("error").textContent =
                        "❌ Нет данных для отображения";
                    document.getElementById("error").style.display = "block";
                    return;
                }

                try {
                    finalRoomData = JSON.parse(storedData);
                    displayLeaderboard(finalRoomData);
                } catch (error) {
                    console.error("Failed to parse leaderboard data:", error);
                    document.getElementById("error").textContent =
                        "❌ Ошибка загрузки данных";
                    document.getElementById("error").style.display = "block";
                }
            }

            async function displayLeaderboard(data) {
                if (!data.users || data.users.length === 0) {
                    document.getElementById("error").textContent =
                        "❌ Нет данных об игроках";
                    document.getElementById("error").style.display = "block";
                    return;
                }

                const sortedUsers = [...data.users].sort(
                    (a, b) => b.score - a.score,
                );

                const uniqueUsernames = [
                    ...new Set(sortedUsers.map((u) => u.username)),
                ];
                await Promise.all(uniqueUsernames.map(fetchUserProfile));

                document.getElementById("room-title").textContent =
                    data.title || "Комната";
                document.getElementById("room-date").textContent =
                    data.timestamp || new Date().toLocaleString();

                const totalPlayers = sortedUsers.length;
                const totalScore = sortedUsers.reduce(
                    (sum, user) => sum + user.score,
                    0,
                );
                const avgScore = Math.round(totalScore / totalPlayers);
                const maxScore = sortedUsers[0]?.score || 0;

                document.getElementById("total-players").textContent =
                    totalPlayers;
                document.getElementById("total-score").textContent = totalScore;
                document.getElementById("avg-score").textContent = avgScore;
                document.getElementById("max-score").textContent = maxScore;

                const winner = sortedUsers[0];
                if (winner) {
                    document.getElementById("winner-section").style.display =
                        "block";
                    document.getElementById("winner-name").textContent =
                        winner.nickname || winner.username;
                    document.getElementById("winner-score").textContent =
                        `🏆 ${winner.score} очков`;

                    const winnerProfile = userProfiles.get(winner.username);
                    const winnerAvatarUrl = winnerProfile
                        ? getImageUrl(winnerProfile.avatar)
                        : null;
                    const winnerAvatar =
                        document.getElementById("winner-avatar");
                    if (winnerAvatarUrl) {
                        winnerAvatar.src = winnerAvatarUrl;
                        winnerAvatar.style.display = "block";
                    } else {
                        winnerAvatar.style.display = "none";
                    }
                }

                const top3Container = document.getElementById("top-3");
                const top3 = sortedUsers.slice(0, 3);

                if (top3.length > 0) {
                    top3Container.style.display = "flex";
                    top3Container.innerHTML = "";

                    const medals = ["🥇", "🥈", "🥉"];
                    const classes = ["first", "second", "third"];
                    const titles = ["Чемпион", "2-е место", "3-е место"];

                    for (let index = 0; index < top3.length; index++) {
                        const user = top3[index];
                        const userProfile = userProfiles.get(user.username);
                        const avatarUrl = userProfile
                            ? getImageUrl(userProfile.avatar)
                            : null;

                        const card = document.createElement("div");
                        card.className = `top-card ${classes[index]}`;
                        card.innerHTML = `
                            <div class="medal">${medals[index]}</div>
                            <div style="font-size: 0.9em; color: var(--secondary); margin-top: 5px;">${titles[index]}</div>
                            <img src="${avatarUrl || load_preset("0.png")}" class="top-card-avatar" onerror="this.src='${load_preset("0.png")}'">
                            <div style="font-weight: bold; font-size: 1.1em; margin: 10px 0;">${user.nickname || user.username}</div>
                            <div style="color: yellow; font-size: 1.3em; font-weight: bold;">${user.score} очков</div>
                            <div style="font-size: 0.8em; color: var(--secondary);">🔥 Серия: ${user.answers_streak || 0}</div>
                        `;
                        top3Container.appendChild(card);
                    }
                }

                const tbody = document.getElementById("leaderboard-body");
                tbody.innerHTML = "";

                for (let index = 0; index < sortedUsers.length; index++) {
                    const user = sortedUsers[index];
                    const userProfile = userProfiles.get(user.username);
                    const avatarUrl = userProfile
                        ? getImageUrl(userProfile.avatar)
                        : null;

                    const row = tbody.insertRow();
                    row.className = "user-row";
                    if (user.username === currentUsername) {
                        row.classList.add("current-user");
                    }

                    const rankCell = row.insertCell(0);
                    const rankBadge = document.createElement("span");
                    const rankNum = index + 1;
                    if (rankNum === 1) {
                        rankBadge.className = "rank-badge rank-1";
                        rankBadge.textContent = "🥇";
                    } else if (rankNum === 2) {
                        rankBadge.className = "rank-badge rank-2";
                        rankBadge.textContent = "🥈";
                    } else if (rankNum === 3) {
                        rankBadge.className = "rank-badge rank-3";
                        rankBadge.textContent = "🥉";
                    } else {
                        rankBadge.className = "rank-badge rank-other";
                        rankBadge.textContent = rankNum;
                    }
                    rankCell.appendChild(rankBadge);

                    const avatarCell = row.insertCell(1);
                    if (avatarUrl) {
                        const avatarImg = document.createElement("img");
                        avatarImg.src = avatarUrl;
                        avatarImg.className = "avatar-img";
                        avatarImg.onerror = () =>
                            (avatarImg.style.display = "none");
                        avatarCell.appendChild(avatarImg);
                    }

                    const nameCell = row.insertCell(2);
                    const displayName = user.nickname || user.username;
                    if (rankNum === 1) {
                        nameCell.innerHTML = `<span class="gold-text">${displayName}</span>`;
                    } else if (rankNum === 2) {
                        nameCell.innerHTML = `<span class="silver-text">${displayName}</span>`;
                    } else if (rankNum === 3) {
                        nameCell.innerHTML = `<span class="bronze-text">${displayName}</span>`;
                    } else {
                        nameCell.textContent = displayName;
                    }
                    if (user.username === currentUsername) {
                        nameCell.innerHTML +=
                            " <span style='color: greenyellow; font-size: 0.8em;'>(Вы)</span>";
                    }

                    const scoreCell = row.insertCell(3);
                    if (rankNum === 1) {
                        scoreCell.innerHTML = `<strong class="gold-text">${user.score}</strong>`;
                    } else if (rankNum === 2) {
                        scoreCell.innerHTML = `<strong class="silver-text">${user.score}</strong>`;
                    } else if (rankNum === 3) {
                        scoreCell.innerHTML = `<strong class="bronze-text">${user.score}</strong>`;
                    } else {
                        scoreCell.innerHTML = `<strong style="color: yellow;">${user.score}</strong>`;
                    }

                    const answersCount = user.answers ? user.answers.length : 0;
                    row.insertCell(4).innerText = answersCount;

                    row.insertCell(5).innerHTML = user.answers_streak
                        ? `🔥 ${user.answers_streak}`
                        : "—";
                }
            }

            function playAgain() {
                sessionStorage.removeItem("finalRoomData");
                redirect("/");
            }

            function goHome() {
                sessionStorage.removeItem("finalRoomData");
                redirect("/");
            }

            function init() {
                loadProfile();

                document
                    .getElementById("play-again-btn")
                    .addEventListener("click", playAgain);
                document
                    .getElementById("home-btn")
                    .addEventListener("click", goHome);
            }

            if (document.readyState === "loading") {
                document.addEventListener("DOMContentLoaded", init);
            } else {
                init();
            }
        </script>
    </body>
</html>
