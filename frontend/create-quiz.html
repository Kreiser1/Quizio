<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Quizio - Создание викторины</title>
	</head>
	<link rel="stylesheet" href="style.css" />
	<script src="utils.js"></script>

	<body>
		<section class="nav glass">
			<h1><a href="/">Quizio</a></h1>
		</section>
		<section class="profile glass">
			<img id="profile-avatar" style="width: 64px; height: 64px" />
			<a id="profile-name" href="/profile.html" style="margin-left: 10px;"></a>
		</section>
		<section
			class="main glass"
			style="
				display: flex;
				flex-direction: column;
				gap: 10px;
				overflow-y: auto;
				max-height: 80vh;
			"
		>
			<label>
				<h2>Создание викторины</h2>
			</label>
			<input
				type="text"
				id="quiz-title"
				placeholder="Название викторины"
				required
				minlength="3"
				maxlength="128"
			/>
			<div style="display: flex; flex-direction: column; gap: 5px">
				<label for="quiz-icon-file">Иконка викторины</label>
				<input type="file" id="quiz-icon-file" accept="image/*" />
				<label style="font-size: 12px; color: #888">
					Рекомендуется загрузить собственную иконку. Если иконка не
					загружена, будет использована иконка по умолчанию.
				</label>
				<div id="icon-preview" style="display: none; margin-top: 5px">
					<label style="font-size: 12px">Предпросмотр:</label>
					<img
						id="icon-preview-img"
						style="width: 64px; height: 64px; margin-top: 5px"
					/>
				</div>
			</div>
			<div style="display: flex; flex-direction: column; gap: 5px">
				<label for="quiz-tags">Теги (через запятую)</label>
				<input
					type="text"
					id="quiz-tags"
					placeholder="#тег1, #тег2, #тег3"
				/>
				<label style="font-size: 12px; color: #888">
					Теги должны начинаться с # и могут содержать буквы, цифры и
					подчеркивания.
				</label>
			</div>
			<div
				style="
					display: flex;
					flex-direction: column;
					gap: 5px;
					flex-shrink: 0;
				"
			>
				<label for="quiz-questions">Вопросы (YAML формат)</label>
				<textarea
					id="quiz-questions"
					placeholder="Введите вопросы в формате YAML..."
					style="
						min-height: 300px;
						min-width: 300px;
						font-family: monospace;
						resize: both;
					"
					rows="15"
				></textarea>
				<label style="font-size: 12px; color: #888">
					Пример формата:
					<pre>
- score: 10
text: "Вопрос."
type: select
answer: 5
title: "Заголовок вопроса"
image: "Base64"
code: "<Код>"
time: 30</pre
					>
				</label>
				<label style="color: red" id="questions-error"></label>
			</div>
			<span style="display: flex; gap: 10px; flex-shrink: 0">
				<button id="create-quiz-btn" class="success">
					Создать викторину
				</button>
				<button id="cancel-btn" class="primary">Отмена</button>
			</span>
			<hr />
			<label style="color: red" id="error"></label>
			<label style="color: green" id="success"></label>
			<script>
				document.addEventListener("DOMContentLoaded", function () {
					load_profile();

					const createQuizBtn =
						document.getElementById("create-quiz-btn");
					const cancelBtn = document.getElementById("cancel-btn");
					const quizTitle = document.getElementById("quiz-title");
					const quizIconFile =
						document.getElementById("quiz-icon-file");
					const quizTags = document.getElementById("quiz-tags");
					const quizQuestions =
						document.getElementById("quiz-questions");
					const error_msg = document.getElementById("error");
					const success_msg = document.getElementById("success");
					const questionsError =
						document.getElementById("questions-error");
					const iconPreview = document.getElementById("icon-preview");
					const iconPreviewImg =
						document.getElementById("icon-preview-img");

					// Create quiz button click
					if (createQuizBtn) {
						createQuizBtn.addEventListener("click", createQuiz);
					}

					// Cancel button click
					if (cancelBtn) {
						cancelBtn.addEventListener("click", function () {
							window.location.href = "/";
						});
					}

					// Icon file preview
					if (quizIconFile) {
						quizIconFile.addEventListener("change", function () {
							const file = this.files[0];
							if (file) {
								const reader = new FileReader();
								reader.onload = function (e) {
									iconPreviewImg.src = e.target.result;
									iconPreview.style.display = "block";
								};
								reader.readAsDataURL(file);
							} else {
								iconPreview.style.display = "none";
							}
						});
					}

					// Focus on title by default
					if (quizTitle) {
						quizTitle.focus();
					}

					function createQuiz() {
						error_msg.innerText = "";
						success_msg.innerText = "";
						questionsError.innerText = "";

						const title = quizTitle.value.trim();
						const iconFile = quizIconFile.files[0];
						const tagsString = quizTags.value.trim();
						const questionsString = quizQuestions.value.trim();

						// Validate title
						if (!title) {
							error_msg.innerText = "Введите название викторины";
							quizTitle.focus();
							return;
						}

						if (title.length < 3 || title.length > 128) {
							error_msg.innerText =
								"Название викторины должно быть от 3 до 128 символов";
							quizTitle.focus();
							return;
						}

						// Parse and validate tags
						let tags = null;
						if (tagsString) {
							tags = tagsString
								.split(",")
								.map((tag) => tag.trim())
								.filter((tag) => tag);

							// Validate tag format
							const tagRegex = /^#\w+(?:_\w+)*$/;
							for (const tag of tags) {
								if (!tagRegex.test(tag)) {
									error_msg.innerText = `Неверный формат тега: ${tag}`;
									quizTags.focus();
									return;
								}
							}

							if (tags.length === 0) {
								tags = null;
							}
						}

						// If there's an icon file, convert to base64 and create quiz
						if (iconFile) {
							const reader = new FileReader();
							reader.onload = function (e) {
								const base64 = e.target.result.split(",")[1];
								createEmptyQuiz(
									title,
									base64,
									tags,
									questionsString,
								);
							};
							reader.onerror = function () {
								error_msg.innerText =
									"Ошибка чтения файла иконки";
							};
							reader.readAsDataURL(iconFile);
						} else {
							// No icon uploaded, use default (1)
							createEmptyQuiz(title, 1, tags, questionsString);
						}
					}

					function createEmptyQuiz(
						title,
						icon,
						tags,
						questionsString,
					) {
						const createQuizBtn =
							document.getElementById("create-quiz-btn");
						const error_msg = document.getElementById("error");
						const success_msg = document.getElementById("success");

						// Disable button during request
						createQuizBtn.disabled = true;
						createQuizBtn.innerText = "Создание...";

						// Create empty quiz first
						const emptyQuestions = [
							{
								score: 0,
								text: "Временный вопрос",
								type: "select",
								answer: 0,
							},
						];

						const payload = {
							title: title,
							icon: icon,
							questions: emptyQuestions,
						};

						if (tags) {
							payload.tags = tags;
						}

						request_json(
							"/quizzes",
							"POST",
							payload,
							(response) => {
								const quizId = response.id;

								// If there are questions, update the quiz with YAML
								if (questionsString && questionsString.trim()) {
									updateQuizWithYaml(quizId, questionsString);
								} else {
									success_msg.innerText =
										"Викторина успешно создана!";
									createQuizBtn.disabled = false;
									createQuizBtn.innerText =
										"Создать викторину";
									clearForm();
									document.querySelector(".main").scrollTop =
										0;
								}
							},
							(error) => {
								error_msg.innerText = error;
								createQuizBtn.disabled = false;
								createQuizBtn.innerText = "Создать викторину";
							},
						);
					}

					function updateQuizWithYaml(quizId, yamlString) {
						const error_msg = document.getElementById("error");
						const success_msg = document.getElementById("success");
						const createQuizBtn =
							document.getElementById("create-quiz-btn");

						createQuizBtn.innerText = "Обновление вопросов...";

						request_json(
							`/quizzes/${quizId}`,
							"PATCH",
							yamlString, // Send YAML string directly
							(response) => {
								success_msg.innerText =
									"Викторина успешно создана с вопросами!";
								createQuizBtn.disabled = false;
								createQuizBtn.innerText = "Создать викторину";
								clearForm();
								document.querySelector(".main").scrollTop = 0;
							},
							(error) => {
								error_msg.innerText = `Викторина создана, но не удалось обновить вопросы: ${error}`;
								createQuizBtn.disabled = false;
								createQuizBtn.innerText = "Создать викторину";
							},
						);
					}

					function clearForm() {
						document.getElementById("quiz-title").value = "";
						document.getElementById("quiz-questions").value = "";
						document.getElementById("quiz-tags").value = "";
						document.getElementById("quiz-icon-file").value = "";
						document.getElementById("icon-preview").style.display =
							"none";
					}
				});

				function load_profile() {
					const profile_name =
						document.getElementById("profile-name");

					request_json(
						"/users/me",
						"GET",
						null,
						(response) => {
							document.getElementById("profile-name").innerText =
								response.full_name ?? response.username;

							if (response.role == "administrator") {
								profile_name.style.color = "red";
							} else if (response.role == "moderator") {
								profile_name.style.color = "yellow";
							}

							if (typeof response.avatar == "number") {
								document.getElementById("profile-avatar").src =
									load_preset(response.avatar);
							} else if (typeof response.avatar == "string") {
								document.getElementById("profile-avatar").src =
									"data:image/png;base64," + response.avatar;
							} else {
								document.getElementById("profile-avatar").src =
									load_preset(1);
							}
						},
						(error) => redirect("/login.html"),
					);
				}
			</script>
		</section>
	</body>
</html>
