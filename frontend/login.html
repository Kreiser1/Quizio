<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quizio - Вход</title>
</head>
<link rel="stylesheet" href="style.css" />
<script src="utils.js"></script>

<body>
    <section class="nav glass">
        <h1><a href="/">Quizio</a></h1>
    </section>
    <section class="main glass">
        <label>
            <h2>Вход в систему</h2>
        </label>
        <input type="text" id="username" placeholder="Имя пользователя" required autocomplete="username" />
        <input type="password" id="password" placeholder="Пароль" required autocomplete="current-password" />
        <span style="display: flex; gap: 10px;">
            <button id="login-btn" class="primary">Вход</button>
            <button id="register-btn" class="success">Регистрация</button>
        </span>
        <hr />
        <label style="color: red" id="error"></label>
        <script>
            document.addEventListener('DOMContentLoaded', function () {
                const loginBtn = document.getElementById('login-btn');
                const registerBtn = document.getElementById('register-btn');
                const usernameInput = document.getElementById('username');
                const passwordInput = document.getElementById('password');
                const error_msg = document.getElementById('error');

                // Login button click
                if (loginBtn) {
                    loginBtn.addEventListener('click', login);
                }

                // Register button click
                if (registerBtn) {
                    registerBtn.addEventListener('click', function () {
                        redirect('/register.html');
                    });
                }

                // Enter key support
                if (usernameInput) {
                    usernameInput.addEventListener('keypress', function (e) {
                        if (e.key === 'Enter') {
                            passwordInput.focus();
                        }
                    });
                }

                if (passwordInput) {
                    passwordInput.addEventListener('keypress', function (e) {
                        if (e.key === 'Enter') {
                            login();
                        }
                    });
                }

                // Focus on username field by default
                if (usernameInput) {
                    usernameInput.focus();
                }

                function login() {
                    error_msg.innerText = "";

                    const username = usernameInput.value.trim();
                    const password = passwordInput.value;

                    // Validate inputs
                    if (!username) {
                        error_msg.innerText = "Введите имя пользователя";
                        usernameInput.focus();
                        return;
                    }

                    if (!password) {
                        error_msg.innerText = "Введите пароль";
                        passwordInput.focus();
                        return;
                    }

                    // Disable button during request
                    loginBtn.disabled = true;
                    loginBtn.innerText = "Вход...";

                    request_json(
                        "/auth/login",
                        "POST",
                        {
                            username: username,
                            password: password,
                        },
                        (response) => {
                            redirect("/");
                        },
                        (error) => {
                            error_msg.innerText = error;
                            loginBtn.disabled = false;
                            loginBtn.innerText = "Вход";

                            // Clear password field on error
                            passwordInput.value = "";
                            passwordInput.focus();
                        },
                    );
                }
            });
        </script>
    </section>
</body>

</html>
