<!doctype html>
<html lang="en" color-scheme="dark">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Quizio - Комната</title>

		<link rel="stylesheet" href="style.css" />
		<link rel="stylesheet" href="classless.css" />
		<script src="utils.js"></script>

		<style>
			.grid {
				display: grid;
				grid-template-columns: 1fr 300px;
				grid-template-rows: 1fr auto;
				gap: 20px;
				height: calc(100vh - 40px);
			}

			.question {
				grid-column: 1;
				grid-row: 1;
				overflow-y: auto;
			}

			.sidebar {
				grid-column: 2;
				grid-row: 1;
				display: flex;
				flex-direction: column;
				gap: 20px;
			}

			.users {
				flex: 1;
				overflow-y: auto;
			}

			.teams {
				flex: 1;
				overflow-y: auto;
			}

			.answer-area {
				grid-column: 1 / -1;
				grid-row: 2;
			}

			.control-panel {
				position: fixed;
				bottom: 20px;
				right: 20px;
				background: rgba(0, 0, 0, 0.9);
				border: 1px solid rgba(255, 255, 255, 0.2);
				border-radius: 10px;
				padding: 15px;
				display: none;
				flex-direction: column;
				gap: 10px;
				min-width: 200px;
				z-index: 1000;
			}

			.control-panel.visible {
				display: flex;
			}

			.control-toggle {
				position: fixed;
				bottom: 20px;
				right: 20px;
				z-index: 1001;
				width: 40px;
				height: 40px;
				border-radius: 50%;
				padding: 0;
				font-size: 20px;
				display: none;
			}

			.control-toggle.visible {
				display: block;
			}

			.question-image {
				max-width: 100%;
				max-height: 300px;
				margin: 10px 0;
			}

			.question-code {
				background: rgba(0, 0, 0, 0.3);
				padding: 15px;
				border-radius: 5px;
				margin: 10px 0;
				white-space: pre-wrap;
				font-family: monospace;
			}

			.answer-form {
				display: flex;
				gap: 10px;
				align-items: stretch;
			}

			.answer-form input {
				flex: 1;
				height: auto;
			}

			.answer-form button {
				white-space: nowrap;
				height: auto;
			}

			.team-badge {
				display: inline-block;
				width: 12px;
				height: 12px;
				border-radius: 50%;
				margin-right: 5px;
			}

			.user-disconnected {
				opacity: 0.5;
			}

			.user-banned {
				opacity: 0.3;
				text-decoration: line-through;
			}

			#question-time {
				font-size: 3em;
				text-align: center;
				margin: 20px 0;
			}
		</style>
	</head>

	<body class="grid">
		<section class="glass question">
			<h3 id="room-name">Загрузка комнаты...</h3>
			<h1 id="question-time"></h1>
			<div id="question-image-container" style="display: none">
				<img id="question-image" class="question-image" />
			</div>
			<div id="question-code-container" style="display: none">
				<pre id="question-code" class="question-code"></pre>
			</div>
			<p id="question-text"></p>
			<div id="question-title" style="display: none">
				<small id="question-title-text" style="color: #888"></small>
			</div>
		</section>

		<div class="sidebar">
			<section class="glass users">
				<h4>Игроки</h4>
				<table>
					<thead>
						<tr>
							<th>Имя</th>
							<th>Очки</th>
							<th>Серия</th>
						</tr>
					</thead>
					<tbody id="room-users"></tbody>
				</table>
			</section>

			<section
				class="glass teams"
				id="teams-section"
				style="display: none"
			>
				<h4>Команды</h4>
				<div id="room-teams"></div>
			</section>
		</div>

		<section class="glass answer-area">
			<form class="answer-form" id="answer-form" onsubmit="return false;">
				<input
					type="text"
					id="answer-input"
					placeholder="Введите ответ..."
					disabled
				/>
				<button type="submit" id="submit-answer" disabled>
					Отправить
				</button>
			</form>
			<div
				id="answer-options"
				style="display: none; margin-top: 10px"
			></div>
		</section>

		<button id="control-toggle" class="control-toggle">⚙️</button>
		<div id="control-panel" class="control-panel">
			<h4 style="margin: 0">Управление</h4>
			<select id="control-question-select">
				<option value="">Выберите вопрос...</option>
			</select>
			<button id="control-show" class="primary">Показать вопрос</button>
			<button id="control-start" class="success">Запустить таймер</button>
			<button id="control-stop" class="warning">Остановить таймер</button>
			<button id="control-end" class="danger">Завершить комнату</button>
		</div>

		<script>
			(function () {
				const frontend = "http://" + window.location.hostname;
				const ws = "ws://" + window.location.hostname + "/api";

				const room_name = document.getElementById("room-name");
				const question_text = document.getElementById("question-text");
				const question_title_text = document.getElementById(
					"question-title-text",
				);
				const question_title =
					document.getElementById("question-title");
				const question_image =
					document.getElementById("question-image");
				const question_image_container = document.getElementById(
					"question-image-container",
				);
				const question_code = document.getElementById("question-code");
				const question_code_container = document.getElementById(
					"question-code-container",
				);
				const room_users = document.getElementById("room-users");
				const room_teams = document.getElementById("room-teams");
				const teams_section = document.getElementById("teams-section");
				const answer_form = document.getElementById("answer-form");
				const answer_input = document.getElementById("answer-input");
				const submit_answer = document.getElementById("submit-answer");
				const answer_options =
					document.getElementById("answer-options");

				const control_toggle =
					document.getElementById("control-toggle");
				const control_panel = document.getElementById("control-panel");
				const control_question_select = document.getElementById(
					"control-question-select",
				);
				const control_show = document.getElementById("control-show");
				const control_start = document.getElementById("control-start");
				const control_stop = document.getElementById("control-stop");
				const control_end = document.getElementById("control-end");

				let currentUserRole = "user";
				let currentQuestionType = null;
				let currentQuestionIndex = null;
				let timerInterval = null;
				let questionTimeRemaining = null;
				let quizData = null;
				let roomData = null;

				const query = Object.fromEntries(
					new URLSearchParams(window.location.search).entries(),
				);

				if (!query.room_token) {
					room_name.innerText = "Ошибка: токен комнаты не указан";
					return;
				}

				// Load initial data
				loadInitialData();

				function loadInitialData() {
					// Load user profile to get role
					request_json(
						"/users/me",
						"GET",
						null,
						(userResponse) => {
							currentUserRole = userResponse.role;
							if (
								userResponse.role === "moderator" ||
								userResponse.role === "administrator"
							) {
								control_toggle.classList.add("visible");
								loadRoomData();
							} else {
								// For regular users, just connect to WebSocket
								connectWebSocket();
							}
						},
						(error) => {
							console.error("Failed to load profile:", error);
							connectWebSocket();
						},
					);
				}

				function loadRoomData() {
					// Get room data using the new endpoint
					request_json(
						`/rooms/${query.room_token}`,
						"GET",
						null,
						(room) => {
							console.log("Room data loaded:", room);
							roomData = room;

							// The quiz is already included in the Room response
							if (room.quiz && room.quiz.questions) {
								quizData = room.quiz;
								populateQuestionSelect();
							}

							// Connect to WebSocket
							connectWebSocket();
						},
						(error) => {
							console.error("Failed to load room data:", error);
							connectWebSocket();
						},
					);
				}

				function populateQuestionSelect() {
					if (!quizData || !quizData.questions) {
						console.error("No quiz data to populate questions");
						return;
					}

					console.log(
						"Populating questions:",
						quizData.questions.length,
					);

					control_question_select.innerHTML =
						'<option value="">Выберите вопрос...</option>';

					quizData.questions.forEach((question, index) => {
						const option = document.createElement("option");
						option.value = index;
						const preview = question.text
							? question.text.substring(0, 50)
							: "Без текста";
						option.innerText = `Вопрос ${index + 1}: ${preview}${question.text && question.text.length > 50 ? "..." : ""}`;
						control_question_select.appendChild(option);
					});
				}

				// Control panel toggle
				control_toggle.addEventListener("click", () => {
					control_panel.classList.toggle("visible");
				});

				// Control buttons
				control_show.addEventListener("click", () => {
					const questionIndex = control_question_select.value;
					if (questionIndex === "" || questionIndex === null) {
						alert("Выберите вопрос");
						return;
					}

					sendControlCommand("show", parseInt(questionIndex));
				});

				control_start.addEventListener("click", () => {
					const questionIndex = control_question_select.value;
					if (questionIndex === "" || questionIndex === null) {
						alert("Выберите вопрос");
						return;
					}

					sendControlCommand("start", parseInt(questionIndex));
				});

				control_stop.addEventListener("click", () => {
					sendControlCommand("stop", null);
				});

				control_end.addEventListener("click", () => {
					if (confirm("Вы уверены, что хотите завершить комнату?")) {
						sendControlCommand("end", null);
					}
				});

				function sendControlCommand(command, question) {
					const payload = {
						command: command,
						question: question,
					};

					request_json(
						`/rooms/${query.room_token}/control`,
						"POST",
						payload,
						(response) => {
							if (command === "end") {
								setTimeout(() => {
									window.location.href = "/";
								}, 1000);
							}
						},
						(error) => console.error("Control error:", error),
					);
				}

				// Answer submission
				answer_form.addEventListener("submit", (e) => {
					e.preventDefault();
					submitAnswer();
				});

				submit_answer.addEventListener("click", submitAnswer);

				answer_input.addEventListener("keypress", (e) => {
					if (e.key === "Enter") {
						e.preventDefault();
						submitAnswer();
					}
				});

				function submitAnswer() {
					const answer = answer_input.value.trim();
					if (
						(!answer && answer !== "0") ||
						currentQuestionIndex === null
					)
						return;

					let formattedAnswer = answer;

					// Format answer based on question type
					if (currentQuestionType === "select") {
						formattedAnswer = parseInt(answer);
						if (isNaN(formattedAnswer)) {
							formattedAnswer = answer;
						}
					} else if (currentQuestionType === "multiselect") {
						try {
							// Try to parse as JSON array
							formattedAnswer = JSON.parse(answer);
						} catch {
							// If not JSON, split by comma
							formattedAnswer = answer.split(",").map((a) => {
								const num = parseInt(a.trim());
								return isNaN(num) ? a.trim() : num;
							});
						}
					}

					request_json(
						`/rooms/${query.room_token}/answer`,
						"POST",
						{
							question: currentQuestionIndex,
							answer: formattedAnswer,
						},
						(response) => {
							// Visual feedback
							submit_answer.style.backgroundColor = response
								? "#4CAF50"
								: "#f44336";
							setTimeout(() => {
								submit_answer.style.backgroundColor = "";
							}, 500);

							if (response) {
								answer_input.value = "";
							}
						},
						(error) => {
							console.error("Answer error:", error);
						},
					);
				}

				// WebSocket connection
				function connectWebSocket() {
					const socket = new WebSocket(
						ws + `/rooms/${query.room_token}/stream`,
					);

					socket.onopen = () => {
						console.log("WebSocket connected");
					};

					socket.onmessage = (event) => {
						try {
							const room_stream = JSON.parse(event.data);

							if (
								!room_stream ||
								Object.keys(room_stream).length === 0
							) {
								// Room closed
								window.location.href = "/";
								return;
							}

							updateRoomDisplay(room_stream);
						} catch (error) {
							console.error("Parse error:", error);
						}
					};

					socket.onerror = (error) => {
						console.error("WebSocket error:", error);
					};

					socket.onclose = (event) => {
						console.log(
							"WebSocket closed:",
							event.code,
							event.reason,
						);
						if (event.code !== 1000) {
							window.location.href = frontend;
						}
					};
				}

				function updateRoomDisplay(room_stream) {
					// Update room name
					room_name.innerText = room_stream.title;

					// Update question display
					if (room_stream.question_text) {
						question_text.innerText = room_stream.question_text;
						question_text.style.display = "block";
						answer_input.disabled = false;
						submit_answer.disabled = false;
						currentQuestionIndex = room_stream.current_question;
						currentQuestionType = room_stream.question_type;

						// Update answer input placeholder based on type
						if (currentQuestionType === "select") {
							answer_input.placeholder =
								"Введите номер ответа...";
						} else if (currentQuestionType === "multiselect") {
							answer_input.placeholder =
								"Введите номера через запятую...";
						} else {
							answer_input.placeholder = "Введите ответ...";
						}
					} else {
						question_text.innerText = "Ожидание вопроса...";
						question_text.style.display = "block";
						answer_input.disabled = true;
						submit_answer.disabled = true;
						currentQuestionIndex = null;
						currentQuestionType = null;
						answer_input.placeholder = "Введите ответ...";
					}

					// Update question title
					if (room_stream.question_title) {
						question_title_text.innerText =
							room_stream.question_title;
						question_title.style.display = "block";
					} else {
						question_title.style.display = "none";
					}

					// Update question image
					if (room_stream.question_image) {
						question_image.src =
							"data:image/png;base64," +
							room_stream.question_image;
						question_image_container.style.display = "block";
					} else {
						question_image_container.style.display = "none";
					}

					// Update question code
					if (room_stream.question_code) {
						question_code.innerText = room_stream.question_code;
						question_code_container.style.display = "block";
					} else {
						question_code_container.style.display = "none";
					}

					// Update timer
					updateTimer(room_stream.question_time);

					// Update users list
					if (room_stream.users) {
						updateUsersList(room_stream.users);
					}

					// Update teams if exist
					if (room_stream.teams && room_stream.teams.length > 0) {
						updateTeamsList(room_stream.teams);
						teams_section.style.display = "block";
					} else {
						teams_section.style.display = "none";
					}

					// Update question select for controls
					if (
						currentUserRole === "moderator" ||
						currentUserRole === "administrator"
					) {
						if (
							room_stream.current_question !== null &&
							room_stream.current_question !== undefined
						) {
							control_question_select.value =
								room_stream.current_question;
						}
					}
				}

				function updateTimer(time) {
					clearInterval(timerInterval);

					if (time && time > 0) {
						questionTimeRemaining = time;
						updateTimerDisplay();

						timerInterval = setInterval(() => {
							questionTimeRemaining -= 0.1;
							if (questionTimeRemaining <= 0) {
								questionTimeRemaining = 0;
								clearInterval(timerInterval);
							}
							updateTimerDisplay();
						}, 100);
					} else {
						questionTimeRemaining = null;
						updateTimerDisplay();
					}
				}

				function updateTimerDisplay() {
					const timerElement =
						document.getElementById("question-time");

					if (
						questionTimeRemaining !== null &&
						questionTimeRemaining > 0
					) {
						const minutes = Math.floor(questionTimeRemaining / 60);
						const seconds = Math.floor(questionTimeRemaining % 60);
						const tenths = Math.floor(
							(questionTimeRemaining % 1) * 10,
						);
						timerElement.innerText = `${minutes}:${seconds.toString().padStart(2, "0")}.${tenths}`;
						timerElement.style.display = "block";

						// Color changes based on time remaining
						if (questionTimeRemaining <= 10) {
							timerElement.style.color = "#f44336";
						} else if (questionTimeRemaining <= 30) {
							timerElement.style.color = "#ff9800";
						} else {
							timerElement.style.color = "";
						}
					} else {
						timerElement.innerText = "";
						timerElement.style.display = "none";
					}
				}

				function updateUsersList(users) {
					room_users.innerHTML = "";

					if (!users || users.length === 0) {
						const row = room_users.insertRow();
						const cell = row.insertCell();
						cell.colSpan = 3;
						cell.innerText = "Нет игроков";
						cell.style.textAlign = "center";
						return;
					}

					// Sort by score descending
					const sortedUsers = [...users].sort(
						(a, b) => b.score - a.score,
					);

					for (const user of sortedUsers) {
						const row = room_users.insertRow();

						// Apply connection state classes
						if (user.connection_state === "disconnected") {
							row.classList.add("user-disconnected");
						} else if (user.connection_state === "banned") {
							row.classList.add("user-banned");
						}

						// Username with status indicator
						const nameCell = row.insertCell(0);
						let statusIndicator = "";
						if (user.connection_state === "connected") {
							statusIndicator = "🟢 ";
						} else if (user.connection_state === "disconnected") {
							statusIndicator = "🟡 ";
						} else if (user.connection_state === "banned") {
							statusIndicator = "🔴 ";
						}
						nameCell.innerHTML = `${statusIndicator}${user.full_name ?? user.username}`;

						// Score
						row.insertCell(1).innerText = user.score;

						// Answer streak
						row.insertCell(2).innerText = user.answers_streak || 0;
					}
				}

				function updateTeamsList(teams) {
					room_teams.innerHTML = "";

					for (const team of teams) {
						const teamDiv = document.createElement("div");
						teamDiv.style.marginBottom = "15px";
						teamDiv.style.padding = "10px";
						teamDiv.style.borderLeft = `3px solid ${team.color}`;

						const teamHeader = document.createElement("div");
						teamHeader.style.display = "flex";
						teamHeader.style.justifyContent = "space-between";
						teamHeader.style.marginBottom = "5px";

						const teamName = document.createElement("strong");
						teamName.innerText = team.title || "Без названия";
						teamName.style.color = team.color;

						const teamScore = document.createElement("span");
						teamScore.innerText = `Очки: ${team.score}`;

						teamHeader.appendChild(teamName);
						teamHeader.appendChild(teamScore);
						teamDiv.appendChild(teamHeader);

						const usersList = document.createElement("div");
						usersList.style.fontSize = "14px";
						usersList.innerText = team.users
							.map((u) => u.username)
							.join(", ");
						teamDiv.appendChild(usersList);

						room_teams.appendChild(teamDiv);
					}
				}
			})();
		</script>
	</body>
</html>
