<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Quizio - Создание достижения</title>
	</head>
	<link rel="stylesheet" href="style.css" />
	<script src="utils.js"></script>

	<body>
		<section class="nav glass">
			<h1><a href="/">Quizio</a></h1>
		</section>
		<section class="profile glass">
			<img id="profile-avatar" style="width: 64px; height: 64px" />
			<a
				id="profile-name"
				href="/profile.html"
				style="margin-left: 10px"
			></a>
		</section>
		<section
			class="main glass"
			style="
				display: flex;
				flex-direction: column;
				gap: 10px;
				overflow-y: auto;
				max-height: 80vh;
			"
		>
			<label>
				<h2>Создание достижения</h2>
			</label>
			<input
				type="text"
				id="achievement-title"
				placeholder="Название достижения"
				required
				minlength="3"
				maxlength="128"
			/>
			<div style="display: flex; flex-direction: column; gap: 5px">
				<label for="achievement-icon-file">Иконка достижения</label>
				<input
					type="file"
					id="achievement-icon-file"
					accept="image/*"
				/>
				<label style="font-size: 12px; color: #888">
					Рекомендуется загрузить собственную иконку. Если иконка не
					загружена, будет использована иконка по умолчанию.
				</label>
				<div id="icon-preview" style="display: none; margin-top: 5px">
					<label style="font-size: 12px">Предпросмотр:</label>
					<img
						id="icon-preview-img"
						style="width: 64px; height: 64px; margin-top: 5px"
					/>
				</div>
			</div>
			<div
				style="
					display: flex;
					flex-direction: column;
					gap: 5px;
					flex-shrink: 0;
				"
			>
				<label for="achievement-condition">Условие (Python код)</label>
				<textarea
					id="achievement-condition"
					placeholder="Введите Python код условия достижения..."
					required
					minlength="4"
					maxlength="16384"
					style="
						min-height: 300px;
						font-family: monospace;
						resize: vertical;
					"
					rows="15"
				></textarea>
				<label style="font-size: 12px; color: #888">
					Код должен возвращать True, если достижение получено, и
					False в противном случае. Доступные переменные: user (объект
					пользователя), quiz (объект викторины), room (объект
					комнаты).
				</label>
				<label style="color: red" id="condition-error"></label>
			</div>
			<span style="display: flex; gap: 10px; flex-shrink: 0">
				<button id="create-achievement-btn" class="success">
					Создать достижение
				</button>
				<button id="cancel-btn" class="primary">Отмена</button>
			</span>
			<hr />
			<label style="color: red" id="error"></label>
			<label style="color: green" id="success"></label>
			<script>
				document.addEventListener("DOMContentLoaded", function () {
					load_profile();

					const createAchievementBtn = document.getElementById(
						"create-achievement-btn",
					);
					const cancelBtn = document.getElementById("cancel-btn");
					const achievementTitle =
						document.getElementById("achievement-title");
					const achievementIconFile = document.getElementById(
						"achievement-icon-file",
					);
					const achievementCondition = document.getElementById(
						"achievement-condition",
					);
					const error_msg = document.getElementById("error");
					const success_msg = document.getElementById("success");
					const conditionError =
						document.getElementById("condition-error");
					const iconPreview = document.getElementById("icon-preview");
					const iconPreviewImg =
						document.getElementById("icon-preview-img");

					// Create achievement button click
					if (createAchievementBtn) {
						createAchievementBtn.addEventListener(
							"click",
							createAchievement,
						);
					}

					// Cancel button click
					if (cancelBtn) {
						cancelBtn.addEventListener("click", function () {
							window.location.href = "/";
						});
					}

					// Icon file preview
					if (achievementIconFile) {
						achievementIconFile.addEventListener(
							"change",
							function () {
								const file = this.files[0];
								if (file) {
									const reader = new FileReader();
									reader.onload = function (e) {
										iconPreviewImg.src = e.target.result;
										iconPreview.style.display = "block";
									};
									reader.readAsDataURL(file);
								} else {
									iconPreview.style.display = "none";
								}
							},
						);
					}

					// Focus on title by default
					if (achievementTitle) {
						achievementTitle.focus();
					}

					function createAchievement() {
						error_msg.innerText = "";
						success_msg.innerText = "";
						conditionError.innerText = "";

						const title = achievementTitle.value.trim();
						const condition = achievementCondition.value.trim();
						const iconFile = achievementIconFile.files[0];

						// Validate title
						if (!title) {
							error_msg.innerText = "Введите название достижения";
							achievementTitle.focus();
							return;
						}

						if (title.length < 3 || title.length > 128) {
							error_msg.innerText =
								"Название достижения должно быть от 3 до 128 символов";
							achievementTitle.focus();
							return;
						}

						// Validate condition
						if (!condition) {
							error_msg.innerText = "Введите условие достижения";
							achievementCondition.focus();
							return;
						}

						if (condition.length < 4 || condition.length > 16384) {
							error_msg.innerText =
								"Условие должно быть от 4 до 16384 символов";
							achievementCondition.focus();
							return;
						}

						// Basic Python syntax validation
						if (
							condition.includes("import ") &&
							!condition.includes("#allowed")
						) {
							conditionError.innerText =
								"Предупреждение: использование import в коде условия";
						}

						// If there's an icon file, convert to base64 and submit
						if (iconFile) {
							const reader = new FileReader();
							reader.onload = function (e) {
								const base64 = e.target.result.split(",")[1];
								submitAchievement(title, base64, condition);
							};
							reader.onerror = function () {
								error_msg.innerText =
									"Ошибка чтения файла иконки";
							};
							reader.readAsDataURL(iconFile);
						} else {
							// No icon uploaded, use default (2)
							submitAchievement(title, 2, condition);
						}
					}

					function submitAchievement(title, icon, condition) {
						const createAchievementBtn = document.getElementById(
							"create-achievement-btn",
						);
						const error_msg = document.getElementById("error");
						const success_msg = document.getElementById("success");

						// Disable button during request
						createAchievementBtn.disabled = true;
						createAchievementBtn.innerText = "Создание...";

						const payload = {
							title: title,
							icon: icon,
							condition: condition,
						};

						request_json(
							"/achievements",
							"POST",
							payload,
							(response) => {
								success_msg.innerText =
									"Достижение успешно создано!";
								createAchievementBtn.disabled = false;
								createAchievementBtn.innerText =
									"Создать достижение";

								// Clear form
								document.getElementById(
									"achievement-title",
								).value = "";
								document.getElementById(
									"achievement-condition",
								).value = "";
								document.getElementById(
									"achievement-icon-file",
								).value = "";
								document.getElementById(
									"icon-preview",
								).style.display = "none";

								// Scroll to top to show success message
								document.querySelector(".main").scrollTop = 0;
							},
							(error) => {
								error_msg.innerText = error;
								createAchievementBtn.disabled = false;
								createAchievementBtn.innerText =
									"Создать достижение";
							},
						);
					}
				});

				function load_profile() {
					const profile_name =
						document.getElementById("profile-name");

					request_json(
						"/users/me",
						"GET",
						null,
						(response) => {
							document.getElementById("profile-name").innerText =
								response.full_name ?? response.username;

							if (response.role == "administrator") {
								profile_name.style.color = "red";
							} else if (response.role == "moderator") {
								profile_name.style.color = "yellow";
							}

							// Check if user has permission to create achievements
							if (
								response.role !== "moderator" &&
								response.role !== "administrator"
							) {
								document.getElementById("error").innerText =
									"У вас нет прав для создания достижений";
								document.getElementById(
									"create-achievement-btn",
								).disabled = true;
							}

							if (typeof response.avatar == "number") {
								document.getElementById("profile-avatar").src =
									load_preset(response.avatar);
							} else if (typeof response.avatar == "string") {
								document.getElementById("profile-avatar").src =
									"data:image/png;base64," + response.avatar;
							} else {
								document.getElementById("profile-avatar").src =
									load_preset(1);
							}
						},
						(error) => redirect("/login.html"),
					);
				}
			</script>
		</section>
	</body>
</html>
