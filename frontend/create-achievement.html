<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Quizio - Создание достижения</title>
    </head>
    <link rel="stylesheet" href="theme.css" />
    <script src="utils.js"></script>

    <body>
        <section class="nav glass">
            <h1>Quizio</h1>
            <a href="/"><h4>🏠 Главная</h4></a>
            <a href="/profile.html"><h4>👤 Профиль</h4></a>
            <a href="/achievements.html"><h4>🏆 Достижения</h4></a>
            <a href="/quizzes.html" id="quizzes-btn" style="display: none"
                ><h4>📚 Викторины</h4></a
            >
            <a href="/admin.html" id="admin-btn" style="display: none;"><h4>👑 Администрирование</h4></a>
        </section>

        <section class="profile glass">
            <a href="/profile.html"
                ><img id="profile-avatar" class="small-picture"
            /></a>
            <h3 id="profile-name" style="margin-left: 10px"></h3>
        </section>

        <section
            class="main glass"
            style="display: flex; flex-direction: column; gap: 15px"
        >
            <h3 id="form-title">🏆 Создание достижения</h3>

            <div
                style="
                    display: flex;
                    flex-direction: column;
                    width: 100%;
                    gap: 5px;
                "
            >
                <label for="achievement-title">📝 Название достижения</label>
                <input
                    type="text"
                    id="achievement-title"
                    placeholder="Введите название достижения..."
                    required
                    minlength="3"
                    maxlength="128"
                />
            </div>

            <div style="display: flex; flex-direction: column; gap: 5px">
                <label for="achievement-icon-file">🖼️ Иконка достижения</label>
                <input
                    type="file"
                    id="achievement-icon-file"
                    accept="image/*"
                />
                <label style="font-size: 12px; color: var(--secondary)">
                    Рекомендуется загрузить собственную иконку. Если иконка не
                    загружена, будет использована иконка по умолчанию.
                </label>
                <div id="icon-preview" style="display: none; margin-top: 10px">
                    <label style="font-size: 12px">Предпросмотр:</label>
                    <img
                        id="icon-preview-img"
                        class="medium-picture"
                        style="display: block; margin-top: 5px"
                    />
                </div>
            </div>

            <div style="display: flex; flex-direction: column; gap: 5px">
                <label for="achievement-condition"
                    >💻 Условие (Python-выражение)</label
                >
                <textarea
                    id="achievement-condition"
                    placeholder='Примеры допустимых условий:

# Достижение за 5 правильных ответов подряд
user.answers_streak >= 5

# Достижение за набор 100 очков
user.score >= 100

# Достижение за прохождение конкретной викторины
room.quiz.id == 42

# Комбинированное условие
user.score >= 500 and user.answers_streak >= 3

# Участие в приватной комнате
room.privacy == "private"'
                    required
                    minlength="4"
                    style="
                        min-height: 200px;
                        font-family: monospace;
                        resize: vertical;
                    "
                    rows="10"
                ></textarea>
                <label style="font-size: 12px; color: var(--secondary)">
                    💡 Доступные переменные:<br />
                    • <code>user</code> - объект пользователя (username, score,
                    answers_streak, ...)<br />
                    • <code>room</code> - объект комнаты (title, privacy, ...)<br />
                </label>
                <p
                    id="condition-warning"
                    style="color: yellow; font-size: 12px; display: none"
                ></p>
            </div>

            <span style="display: flex; gap: 10px">
                <button id="create-achievement-btn" class="success">
                    🏆 Создать достижение
                </button>
                <button id="cancel-btn" class="primary">❌ Отмена</button>
            </span>

            <hr />

            <p id="error" style="color: crimson; display: none"></p>
            <p id="success" style="color: greenyellow; display: none"></p>
        </section>

        <section class="side glass scroll" style="width: 100%">
            <h4>📖 Помощь</h4>
            <div style="padding: 15px; font-size: 16px">
                 <div style="margin-bottom: 15px">
                    <strong>📝 Примеры:</strong>
                    <pre
                        style="
                            background: rgba(0, 0, 0, 0.3);
                            padding: 8px;
                            margin-top: 5px;
                            border-radius: 5px;
                            overflow-x: auto;
                        "
                    >
user.answers_streak >= 5
user.score >= 100
room.quiz.id == 42
room.privacy == "private"
user.score >= 500 and user.answers_streak >= 3</pre
                    >
                </div>
            </div>
        </section>

        <script>
            let currentUserRole = "user";
            let currentUsername = "";

            function getImageUrl(icon) {
                if (typeof icon === "number") {
                    return load_preset(`${icon}.png`);
                } else if (typeof icon === "string" && icon.length > 0) {
                    return `data:image/png;base64,${icon}`;
                }
                return null;
            }

            function getRoleColor(role) {
                return role === "administrator"
                    ? "crimson"
                    : role === "moderator"
                      ? "yellow"
                      : "greenyellow";
            }

            function showMessage(element, message, isError = true) {
                if (!element) return;
                element.textContent = message;
                element.style.display = "block";

                if (!isError) {
                    setTimeout(() => {
                        if (element.textContent === message) {
                            element.style.opacity = "0.5";
                            setTimeout(() => {
                                if (element.textContent === message) {
                                    element.style.display = "none";
                                    element.style.opacity = "";
                                }
                            }, 2000);
                        }
                    }, 3000);
                }
            }

            function hideMessages() {
                document.getElementById("error").style.display = "none";
                document.getElementById("success").style.display = "none";
            }

            function loadProfile() {
                UsersAPI.get_profile(
                    (profile) => {
                        currentUsername = profile.username;
                        currentUserRole = profile.role;

                        const nameElement =
                            document.getElementById("profile-name");
                        nameElement.textContent =
                            profile.nickname || profile.username;
                        nameElement.style.color = getRoleColor(profile.role);

                        const avatarUrl = getImageUrl(profile.avatar);
                        const avatarElement =
                            document.getElementById("profile-avatar");
                        if (avatarUrl) {
                            avatarElement.src = avatarUrl;
                            avatarElement.onerror = () =>
                                (avatarElement.style.display = "none");
                        } else {
                            avatarElement.style.display = "none";
                        }

                        if (
                            currentUserRole !== "moderator" &&
                            currentUserRole !== "administrator"
                        ) {
                            const createBtn = document.getElementById(
                                "create-achievement-btn",
                            );
                            if (createBtn) {
                                createBtn.disabled = true;
                                createBtn.title = "Недостаточно прав";
                            }
                            showMessage(
                                document.getElementById("error"),
                                "❌ У вас нет прав для создания достижений",
                            );
                        }
                    },
                    (error) => {
                        console.error("Failed to load profile:", error);
                        if (
                            error.message.includes("401") ||
                            error.message.includes("403") ||
                            error.message.includes("404")
                        ) {
                            redirect("/login.html");
                        }
                    },
                );
            }

            async function createAchievement() {
                hideMessages();

                const titleInput = document.getElementById("achievement-title");
                const conditionInput = document.getElementById(
                    "achievement-condition",
                );
                const iconFile = document.getElementById(
                    "achievement-icon-file",
                ).files[0];
                const createBtn = document.getElementById(
                    "create-achievement-btn",
                );
                const warningElement =
                    document.getElementById("condition-warning");

                const title = titleInput.value.trim();
                const condition = conditionInput.value.trim();

                if (!title) {
                    showMessage(
                        document.getElementById("error"),
                        "❌ Введите название достижения",
                    );
                    titleInput.focus();
                    return;
                }

                if (title.length < 3) {
                    showMessage(
                        document.getElementById("error"),
                        "❌ Название должно содержать минимум 3 символа",
                    );
                    titleInput.focus();
                    return;
                }

                if (title.length > 128) {
                    showMessage(
                        document.getElementById("error"),
                        "❌ Название не должно превышать 128 символов",
                    );
                    titleInput.focus();
                    return;
                }

                if (!condition) {
                    showMessage(
                        document.getElementById("error"),
                        "❌ Введите условие достижения",
                    );
                    conditionInput.focus();
                    return;
                }

                if (condition.length < 4) {
                    showMessage(
                        document.getElementById("error"),
                        "❌ Условие должно содержать минимум 4 символа",
                    );
                    conditionInput.focus();
                    return;
                }

                warningElement.style.display = "none";

                createBtn.disabled = true;
                createBtn.textContent = "⏳ Создание...";

                let icon = 2;

                if (iconFile) {
                    try {
                        const base64 = await file_to_base64(iconFile);
                        icon = base64;
                    } catch (error) {
                        console.error("Failed to convert icon:", error);
                        showMessage(
                            document.getElementById("error"),
                            "❌ Ошибка обработки иконки",
                        );
                        createBtn.disabled = false;
                        createBtn.textContent = "🏆 Создать достижение";
                        return;
                    }
                }

                const payload = {
                    title: title,
                    icon: icon,
                    condition: condition,
                };

                AchievementsAPI.create(
                    payload,
                    (response) => {
                        showMessage(
                            document.getElementById("success"),
                            "✅ Достижение успешно создано!",
                            false,
                        );

                        titleInput.value = "";
                        conditionInput.value = "";
                        document.getElementById("achievement-icon-file").value =
                            "";
                        document.getElementById("icon-preview").style.display =
                            "none";
                        warningElement.style.display = "none";

                        createBtn.disabled = false;
                        createBtn.textContent = "🏆 Создать достижение";
                        titleInput.focus();
                    },
                    (error) => {
                        console.error("Failed to create achievement:", error);
                        let errorMessage = "❌ Не удалось создать достижение";
                        if (error.message) {
                            if (error.message.includes("422")) {
                                errorMessage =
                                    "❌ Некорректный синтаксис в условии достижения";
                            } else if (error.message.includes("409")) {
                                errorMessage =
                                    "❌ Достижение с таким названием уже существует";
                            } else if (error.message.includes("403")) {
                                errorMessage =
                                    "❌ Условие содержит запрещённые конструкции или слишком длинное";
                            }
                        }
                        showMessage(
                            document.getElementById("error"),
                            errorMessage,
                        );
                        createBtn.disabled = false;
                        createBtn.textContent = "🏆 Создать достижение";
                    },
                );
            }

            function setupEventListeners() {
                const createBtn = document.getElementById(
                    "create-achievement-btn",
                );
                if (createBtn) {
                    createBtn.addEventListener("click", createAchievement);
                }

                const cancelBtn = document.getElementById("cancel-btn");
                if (cancelBtn) {
                    cancelBtn.addEventListener("click", () => {
                        redirect("/achievements.html");
                    });
                }

                const iconFileInput = document.getElementById(
                    "achievement-icon-file",
                );
                const iconPreview = document.getElementById("icon-preview");
                const iconPreviewImg =
                    document.getElementById("icon-preview-img");

                if (iconFileInput) {
                    iconFileInput.addEventListener("change", function () {
                        const file = this.files[0];
                        if (file) {
                            const reader = new FileReader();
                            reader.onload = function (e) {
                                iconPreviewImg.src = e.target.result;
                                iconPreview.style.display = "block";
                            };
                            reader.readAsDataURL(file);
                        } else {
                            iconPreview.style.display = "none";
                        }
                    });
                }

                const titleInput = document.getElementById("achievement-title");
                if (titleInput) {
                    titleInput.addEventListener("keypress", (e) => {
                        if (e.key === "Enter") {
                            e.preventDefault();
                            document
                                .getElementById("achievement-condition")
                                .focus();
                        }
                    });
                }
            }

            function init() {
                loadProfile();
                setupEventListeners();
            }

            if (document.readyState === "loading") {
                document.addEventListener("DOMContentLoaded", init);
            } else {
                init();
            }
        </script>
    </body>
</html>
