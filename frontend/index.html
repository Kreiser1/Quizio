<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Quizio - Главная</title>
    </head>
    <link rel="stylesheet" href="style.css" />
    <script src="utils.js"></script>
    <body>
        <section class="nav glass">
            <h1><label>Quizio</label></h1>
        </section>
        <section class="profile glass">
            <img id="profile-avatar" style="width: 64px; height: 64px" />
            <a id="profile-name" href="/profile.html"></a>
        </section>
        <section
            class="main glass"
            style="
                display: grid;
                grid-template-rows: 4fr 1fr;
                justify-content: stretch;
                align-items: start;
            "
        >
            <div class="scroll">
                <label><h3>Комнаты</h3></label>
                <table>
                    <thead>
                        <th></th>
                        <th>Название</th>
                        <th>Билет</th>
                        <th>Викторина</th>
                        <th>Владелец</th>
                    </thead>
                    <tbody id="rooms"></tbody>
                </table>
                <label style="color: red" id="rooms-error"></label>
            </div>
            <div style="display: flex; flex-direction: row; gap: 5px">
                <input type="text" id="search-query" placeholder="Название" />
                <input
                    type="number"
                    placeholder="Начать с..."
                    min="0"
                    max="25"
                    id="search-offset"
                    value="0"
                    required
                />
                <input
                    type="range"
                    min="1"
                    max="25"
                    value="5"
                    id="search-count"
                    required
                />
                <button onclick="load_rooms()">🔍</button>
            </div>
        </section>
        <section class="side glass scroll">
            <table>
                <tbody id="achievements"></tbody>
            </table>
            <label style="color: red" id="achievements-error"></label>
        </section>
        <script>
            function load_profile() {
                const profile = request_json(
                    "/users/me",
                    "GET",
                    null,
                    (response) => {
                        get_element("profile-name").innerText =
                            response.full_name ?? response.username;

                        if (typeof response.avatar == "number")
                            get_element("profile-avatar").src = load_preset(
                                response.avatar,
                            );
                        else if (typeof response.avatar == "string")
                            get_element("profile-avatar").src =
                                "data:image/png;base64," + response.avatar;
                        else get_element("profile-avatar").src = load_preset(1);
                    },
                    (error) => redirect("/login.html"),
                );
            }

            load_profile();

            const achievements_error_msg = get_element("achievements-error");

            function load_achievements() {
                const achievements = get_element("achievements");

                achievements_error_msg.innerText = "";

                const profile = request_json(
                    "/achievements",
                    "GET",
                    null,
                    (response) => {
                        for (const achievement of response) {
                            const row = achievements.insertRow();
                            const src =
                                typeof achievement.icon == "number"
                                    ? load_preset(achievement.icon)
                                    : "data:image/png;base64," +
                                      achievement.icon;
                            row.insertCell().innerHTML = `<img style="width: 64px; height: 64px" src="${src}" />`;
                            row.insertCell().innerHTML = `<label>${achievement.title}</label>`;
                        }
                    },
                    (error) => (achievements_error_msg.innerText = error),
                );
            }

            load_achievements();

            const rooms_error_msg = get_element("rooms-error");

            function load_rooms() {
                const rooms = get_element("rooms");

                rooms.innerHTML = "";

                let query = get_element("search-query").value;
                query = query == "" ? null : "query=" + query + "&";

                rooms_error_msg.innerText = "";

                const profile = request_json(
                    `/rooms/query?${query ?? ""}offset=${get_element("search-offset").value}&count=${get_element("search-count").value}`,
                    "GET",
                    null,
                    (response) => {
                        for (const room of response) {
                            const row = rooms.insertRow();
                            const src =
                                typeof room.quiz.icon == "number"
                                    ? load_preset(room.quiz.icon)
                                    : "data:image/png;base64," + room.quiz.icon;
                            row.insertCell().innerHTML = `<img style="width: 64px; height: 64px" src="${src}" />`;
                            row.insertCell().innerHTML = `<label>${room.title}</label>`;
                            row.insertCell().innerHTML = `<a href="${frontend}/room.html?room_token=${room.room_token}">${room.room_token}</label>`;
                            row.insertCell().innerHTML = `<label>${room.quiz.title}</label>`;
                            row.insertCell().innerHTML = `<label>${room.owner}</label>`;
                        }
                    },
                    (error) => (rooms_error_msg.innerText = error),
                );
            }

            load_rooms();
        </script>
    </body>
</html>
