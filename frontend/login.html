<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Quizio - Вход</title>
    </head>
    <link rel="stylesheet" href="theme.css" />
    <script src="utils.js"></script>

    <body>
        <section class="nav glass">
            <h1
                style="
                    text-shadow:
                        0 0 40px #fff,
                        0 0 80px #fff;
                "
            >
                Quizio
            </h1>
        </section>
        <section class="main glass">
            <label>
                <h2>🔐 Вход в систему</h2>
            </label>
            <input
                type="text"
                id="username"
                placeholder="Имя пользователя"
                required
                autocomplete="username"
            />
            <input
                type="password"
                id="password"
                placeholder="Пароль"
                required
                autocomplete="current-password"
            />
            <span style="display: flex; gap: 10px; justify-content: center">
                <button id="login-btn" class="primary">🚪 Вход</button>
                <button id="register-btn" class="success">
                    📝 Регистрация
                </button>
            </span>
            <hr />
            <p id="error" style="color: crimson; text-align: center"></p>

            <script>
                const loginBtn = document.getElementById("login-btn");
                const registerBtn = document.getElementById("register-btn");
                const usernameInput = document.getElementById("username");
                const passwordInput = document.getElementById("password");
                const errorMsg = document.getElementById("error");

                function showError(message) {
                    errorMsg.textContent = message;
                    errorMsg.style.display = "block";
                    setTimeout(() => {
                        if (errorMsg.textContent === message) {
                            errorMsg.style.opacity = "0.5";
                            setTimeout(() => {
                                if (errorMsg.textContent === message) {
                                    errorMsg.style.display = "none";
                                    errorMsg.style.opacity = "";
                                }
                            }, 2000);
                        }
                    }, 3000);
                }

                function clearError() {
                    errorMsg.textContent = "";
                    errorMsg.style.display = "none";
                }

                function setLoading(button, isLoading) {
                    if (isLoading) {
                        button.disabled = true;
                        button.textContent = "⏳ Загрузка...";
                    } else {
                        button.disabled = false;
                        button.textContent = "🚪 Вход";
                    }
                }

                function login() {
                    clearError();

                    const username = usernameInput.value.trim();
                    const password = passwordInput.value;

                    if (!username) {
                        showError("❌ Введите имя пользователя");
                        usernameInput.focus();
                        return;
                    }

                    if (!password) {
                        showError("❌ Введите пароль");
                        passwordInput.focus();
                        return;
                    }

                    setLoading(loginBtn, true);

                    AuthAPI.login(
                        { username: username, password: password },
                        (response) => {
                            redirect("/");
                        },
                        (error) => {
                            console.error("Login failed:", error);
                            let errorMessage =
                                "❌ Неверное имя пользователя или пароль";

                            if (error.message) {
                                if (error.message.includes("429")) {
                                    errorMessage =
                                        "⏰ Слишком много попыток. Подождите немного.";
                                } else if (error.message.includes("500")) {
                                    errorMessage =
                                        "⚠️ Неизвестная. Попробуйте позже.";
                                }
                            }

                            showError(errorMessage);
                            setLoading(loginBtn, false);
                            passwordInput.value = "";
                            passwordInput.focus();
                        },
                    );
                }

                function register() {
                    redirect("/register.html");
                }

                loginBtn.addEventListener("click", login);
                registerBtn.addEventListener("click", register);

                usernameInput.addEventListener("keypress", (e) => {
                    if (e.key === "Enter") {
                        passwordInput.focus();
                    }
                });

                passwordInput.addEventListener("keypress", (e) => {
                    if (e.key === "Enter") {
                        login();
                    }
                });

                usernameInput.focus();
            </script>
        </section>
    </body>
</html>
