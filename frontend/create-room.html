<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Quizio - Создание комнаты</title>
	</head>
	<link rel="stylesheet" href="style.css" />
	<script src="utils.js"></script>

	<body>
		<section class="nav glass">
			<h1><a href="/">Quizio</a></h1>
		</section>
		<section class="profile glass">
			<img id="profile-avatar" style="width: 64px; height: 64px" />
			<a
				id="profile-name"
				href="/profile.html"
				style="margin-left: 10px"
			></a>
		</section>
		<section
			class="main glass"
			style="
				display: flex;
				flex-direction: column;
				gap: 10px;
				overflow-y: auto;
				max-height: 80vh;
			"
		>
			<label>
				<h2>Создание комнаты</h2>
			</label>
			<input
				type="text"
				id="room-title"
				placeholder="Название комнаты"
				required
				minlength="3"
				maxlength="128"
			/>
			<select id="room-privacy" required>
				<option value="public">Публичная</option>
				<option value="private">Приватная</option>
			</select>
			<div
				style="
					display: flex;
					flex-direction: column;
					gap: 5px;
					flex-shrink: 0;
				"
			>
				<label for="quiz-search">Поиск викторины</label>
				<input
					type="search"
					id="quiz-search"
					placeholder="Поиск викторины по названию..."
				/>
				<select
					id="quiz-select"
					required
					size="8"
					style="
						min-height: 200px;
						max-height: 300px;
						overflow-y: auto;
					"
				>
					<option value="" disabled selected>
						Загрузка викторин...
					</option>
				</select>
				<label style="color: red" id="quiz-error"></label>
			</div>
			<span style="display: flex; gap: 10px; flex-shrink: 0">
				<button id="create-room-btn" class="success">
					Создать комнату
				</button>
				<button id="cancel-btn" class="primary">Отмена</button>
			</span>
			<hr />
			<label style="color: red" id="error"></label>
			<label style="color: green" id="success"></label>
			<script>
				document.addEventListener("DOMContentLoaded", function () {
					load_profile();
					searchQuizzes();

					const createRoomBtn =
						document.getElementById("create-room-btn");
					const cancelBtn = document.getElementById("cancel-btn");
					const roomTitleInput =
						document.getElementById("room-title");
					const roomPrivacySelect =
						document.getElementById("room-privacy");
					const quizSearchInput =
						document.getElementById("quiz-search");
					const quizSelect = document.getElementById("quiz-select");
					const error_msg = document.getElementById("error");
					const success_msg = document.getElementById("success");
					const quizError = document.getElementById("quiz-error");

					let searchTimeout = null;

					// Create room button click
					if (createRoomBtn) {
						createRoomBtn.addEventListener("click", createRoom);
					}

					// Cancel button click
					if (cancelBtn) {
						cancelBtn.addEventListener("click", function () {
							window.location.href = "/";
						});
					}

					// Quiz search with debounce
					if (quizSearchInput) {
						quizSearchInput.addEventListener("input", function () {
							clearTimeout(searchTimeout);
							searchTimeout = setTimeout(() => {
								searchQuizzes();
							}, 500);
						});

						quizSearchInput.addEventListener(
							"keypress",
							function (e) {
								if (e.key === "Enter") {
									e.preventDefault();
									clearTimeout(searchTimeout);
									searchQuizzes();
								}
							},
						);
					}

					// Click on quiz select to search if needed
					if (quizSelect) {
						quizSelect.addEventListener("focus", function () {
							if (quizSelect.options.length <= 1) {
								searchQuizzes();
							}
						});
					}

					// Focus on room title by default
					if (roomTitleInput) {
						roomTitleInput.focus();
					}

					function createRoom() {
						error_msg.innerText = "";
						success_msg.innerText = "";

						const title = roomTitleInput.value.trim();
						const privacy = roomPrivacySelect.value;
						const quizId = quizSelect.value;

						// Validate title
						if (!title) {
							error_msg.innerText = "Введите название комнаты";
							roomTitleInput.focus();
							return;
						}

						if (title.length < 3 || title.length > 128) {
							error_msg.innerText =
								"Название комнаты должно быть от 3 до 128 символов";
							roomTitleInput.focus();
							return;
						}

						// Validate quiz selection
						if (!quizId) {
							error_msg.innerText = "Выберите викторину";
							quizSelect.focus();
							return;
						}

						// Disable button during request
						createRoomBtn.disabled = true;
						createRoomBtn.innerText = "Создание...";

						request_json(
							"/rooms",
							"POST",
							{
								title: title,
								privacy: privacy,
								quiz_id: parseInt(quizId),
							},
							(response) => {
								success_msg.innerText =
									"Комната успешно создана! Перенаправление...";
								// Redirect to the created room
								setTimeout(() => {
									window.location.href = `/room.html?room_token=${response}`;
								}, 1500);
							},
							(error) => {
								error_msg.innerText = error;
								createRoomBtn.disabled = false;
								createRoomBtn.innerText = "Создать комнату";
							},
						);
					}
				});

				function load_profile() {
					const profile_name =
						document.getElementById("profile-name");

					request_json(
						"/users/me",
						"GET",
						null,
						(response) => {
							document.getElementById("profile-name").innerText =
								response.full_name ?? response.username;

							if (response.role == "administrator") {
								profile_name.style.color = "red";
							} else if (response.role == "moderator") {
								profile_name.style.color = "yellow";
							}

							// Check if user has permission to create rooms
							if (
								response.role !== "moderator" &&
								response.role !== "administrator"
							) {
								document.getElementById("error").innerText =
									"У вас нет прав для создания комнат";
								document.getElementById(
									"create-room-btn",
								).disabled = true;
							}

							if (typeof response.avatar == "number") {
								document.getElementById("profile-avatar").src =
									load_preset(response.avatar);
							} else if (typeof response.avatar == "string") {
								document.getElementById("profile-avatar").src =
									"data:image/png;base64," + response.avatar;
							} else {
								document.getElementById("profile-avatar").src =
									load_preset(1);
							}
						},
						(error) => redirect("/login.html"),
					);
				}

				function searchQuizzes() {
					const quizSelect = document.getElementById("quiz-select");
					const quizError = document.getElementById("quiz-error");
					const searchQuery = document
						.getElementById("quiz-search")
						.value.trim();

					// Store current selection
					const currentValue = quizSelect.value;

					quizSelect.innerHTML = "";
					quizError.innerText = "";

					// Show loading state
					const loadingOption = document.createElement("option");
					loadingOption.value = "";
					loadingOption.disabled = true;
					loadingOption.innerText = "Поиск викторин...";
					quizSelect.appendChild(loadingOption);

					const params = new URLSearchParams();
					if (searchQuery) {
						params.append("query", searchQuery);
					}
					params.append("count", "100"); // Get up to 100 quizzes
					params.append("offset", "0");

					request_json(
						`/quizzes/query?${params.toString()}`,
						"GET",
						null,
						(response) => {
							quizSelect.innerHTML = "";

							if (!response || response.length === 0) {
								const option = document.createElement("option");
								option.value = "";
								option.disabled = true;
								option.innerText = searchQuery
									? "Викторины не найдены"
									: "Нет доступных викторин";
								quizSelect.appendChild(option);
								return;
							}

							// Add default option
							const defaultOption =
								document.createElement("option");
							defaultOption.value = "";
							defaultOption.disabled = true;
							defaultOption.selected = true;
							defaultOption.innerText = "Выберите викторину...";
							quizSelect.appendChild(defaultOption);

							let foundPreviousSelection = false;

							for (const quiz of response) {
								const option = document.createElement("option");
								option.value = quiz.id;
								option.innerText = `${quiz.title} [${quiz.creation_time}]`;

								// Restore previous selection if still exists
								if (quiz.id.toString() === currentValue) {
									option.selected = true;
									foundPreviousSelection = true;
								}

								quizSelect.appendChild(option);
							}

							// If previous selection was restored, update the default option
							if (foundPreviousSelection) {
								defaultOption.selected = false;
							}
						},
						(error) => {
							quizError.innerText = error;
							quizSelect.innerHTML = "";
							const option = document.createElement("option");
							option.value = "";
							option.disabled = true;
							option.innerText = "Ошибка загрузки викторин";
							quizSelect.appendChild(option);
						},
					);
				}
			</script>
		</section>
	</body>
</html>
