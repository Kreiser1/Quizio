<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Quizio - Главная</title>
    </head>
    <link rel="stylesheet" href="theme.css" />
    <script src="utils.js"></script>

    <body>
        <section class="nav glass">
            <h1>Quizio</h1>
            <a href=""><h4>Главная</h4></a>
            <a href="/profile.html"><h4>Профиль</h4></a>
            <a href="/achievements.html"><h4>Достижения</h4></a>
        </section>
        <section class="profile glass">
            <a href="/profile.html"><img id="profile-avatar" class="small-picture" /></a>
            <h4 id="profile-name"></h4>
        </section>
        <section
            class="main glass"
            style="
                display: grid;
                grid-template-rows: 1fr auto;
                justify-content: stretch;
                align-items: start;
            "
        >
            <div style="overflow-x: auto">
                <label>
                    <h4>Комнаты</h4>
                </label>
                <table style="width: 100%">
                    <thead>
                        <tr>
                            <th></th>
                            <th>Название</th>
                            <th>Билет</th>
                            <th>Викторина</th>
                            <th>Владелец</th>
                            <th>Игроков</th>
                            <th>Статус</th>
                        </tr>
                    </thead>
                    <tbody id="rooms"></tbody>
                </table>
                <p class="no-select" style="color: red" id="rooms-error"></label>
            </div>
            <div
                style="
                    display: flex;
                    flex-direction: row;
                    gap: 5px;
                    align-items: center;
                    justify-content: stretch;
                "
            >
                <input type="search" id="search-query" placeholder="Поиск..." />
                <input
                    type="number"
                    min="0"
                    value=""
                    id="search-count"
                    placeholder="Количество"
                />
                <input
                    type="number"
                    min="0"
                    value=""
                    id="search-offset"
                    placeholder="Страница"
                />
                <button
                    id="create-room-btn"
                    class="success no-wrap"
                    style="display: none"
                >
                    Создать
                </button>
            </div>
        </section>
        <section
            class="side glass scroll"
            style="display: flex; flex-direction: column"
        >
            <a href="/achievements.html"><h4>Достижения</h4></a>
            <table>
                <tbody id="achievements"></tbody>
            </table>
            <p class="no-select" style="color: red" id="achievements-error"></p>
        </section>
        <script>
    // State management
    let currentProfile = null;
    let roomsRefreshInterval = null;
    let achievementsRefreshInterval = null;

    // Load profile data
    function loadProfile() {
        request_json(
            "/users/me",
            "GET",
            null,
            (profile) => {
                currentProfile = profile;
                updateProfileUI(profile);
                updateCreateRoomButton(profile);
            },
            (error) => {
                console.error("Failed to load profile:", error);
                // Redirect to login if unauthorized
                if (error.message.includes("401")) {
                    redirect("/login.html");
                }
            }
        );
    }

    // Update profile UI elements
    function updateProfileUI(profile) {
        const avatarImg = get_element("profile-avatar");
        const nameElement = get_element("profile-name");

        if (avatarImg) {
            if (typeof profile.avatar === "number" || (typeof profile.avatar === "string" && !profile.avatar.startsWith("data:"))) {
                // Avatar is a number (0-99) or numeric string
                const avatarNumber = parseInt(profile.avatar);
                if (!isNaN(avatarNumber) && avatarNumber >= 0 && avatarNumber <= 99) {
                    avatarImg.src = load_preset(avatarNumber + ".png");
                } else {
                    avatarImg.src = load_preset("0.png");
                }
            } else if (typeof profile.avatar === "string" && profile.avatar.startsWith("data:")) {
                // Avatar is base64
                avatarImg.src = profile.avatar;
            } else {
                // Default avatar
                avatarImg.src = load_preset("0.png");
            }
        }

        if (nameElement) {
            nameElement.textContent = profile.nickname || profile.username;
        }
    }

    // Show/hide create room button based on role (only moderators and admins)
    function updateCreateRoomButton(profile) {
        const createBtn = get_element("create-room-btn");
        if (createBtn) {
            // Only show for moderator or administrator
            if (profile.role === "moderator" || profile.role === "administrator") {
                createBtn.style.display = "block";
                createBtn.addEventListener("click", () => {
                    window.location.href = "/create-room.html";
                });
            } else {
                createBtn.style.display = "none";
            }
        }
    }

    // Load rooms list
    function loadRooms() {
        const query = get_element("search-query")?.value || "";
        const count = get_element("search-count")?.value || 25;
        const offset = get_element("search-offset")?.value || 0;

        let url = `/rooms/query?count=${count}&offset=${offset}`;
        if (query.trim()) {
            url += `&query=${encodeURIComponent(query)}`;
        }

        request_json(
            url,
            "GET",
            null,
            (rooms) => {
                displayRooms(rooms);
                const errorElement = get_element("rooms-error");
                if (errorElement) errorElement.textContent = "";
            },
            (error) => {
                console.error("Failed to load rooms:", error);
                const errorElement = get_element("rooms-error");
                if (errorElement) errorElement.textContent = "Не удалось загрузить комнаты: " + error.message;
            }
        );
    }

    // Display rooms in table
    function displayRooms(rooms) {
        const tbody = get_element("rooms");
        if (!tbody) return;

        if (!rooms || rooms.length === 0) {
            tbody.innerHTML = '<tr><td colspan="7" style="text-align: center;">Нет доступных комнат</td></tr>';
            return;
        }

        tbody.innerHTML = rooms.map(room => `
            <tr onclick="window.location.href='/room.html?room_token=${room.room_token}'" style="cursor: pointer;">
                <td>${getPrivacyIcon(room.privacy)}</td>
                <td><strong>${escapeHtml(room.title)}</strong></td>
                <td><code>${room.room_token.substring(0, 8)}...</code></td>
                <td>${escapeHtml(room.quiz.title)}</td>
                <td>${escapeHtml(room.owner)}</td>
                <td>${room.users}</td>
                <td>${getRoomStateBadge(room.state)}</td>
             </tr>
        `).join("");
    }

    // Helper: Get privacy icon
    function getPrivacyIcon(privacy) {
        return privacy === "public" ? "🌐" : "🔒";
    }

    // Helper: Get room state badge
    function getRoomStateBadge(state) {
        if (state === "active") {
            return '<span style="color: #10b981;">● Играет</span>';
        }
        return '<span style="color: #f59e0b;">○ Ожидание</span>';
    }

    // Load achievements
    function loadAchievements() {
        request_json(
            "/achievements",
            "GET",
            null,
            (achievements) => {
                displayAchievements(achievements);
                const errorElement = get_element("achievements-error");
                if (errorElement) errorElement.textContent = "";
            },
            (error) => {
                console.error("Failed to load achievements:", error);
                const errorElement = get_element("achievements-error");
                if (errorElement) errorElement.textContent = "Не удалось загрузить достижения";
            }
        );
    }

    // Display achievements in sidebar
    function displayAchievements(achievements) {
        const tbody = get_element("achievements");
        if (!tbody) return;

        if (!achievements || achievements.length === 0) {
            tbody.innerHTML = '<tr><td style="text-align: center;">Нет достижений</td></tr>';
            return;
        }

        tbody.innerHTML = achievements.map(achievement => `
            <tr>
                <td style="display: flex; align-items: center; gap: 10px; padding: 8px;">
                    ${getAchievementIcon(achievement.icon)}
                    <div>
                        <strong>${escapeHtml(achievement.title)}</strong>
                        <div style="font-size: 0.85em; color: var(--secondary);">
                            ${achievement.condition === "<secret>" ? "🔒 Скрыто" : escapeHtml(achievement.condition)}
                        </div>
                    </div>
                </td>
            </tr>
        `).join("");
    }

    // Helper: Get achievement icon
    function getAchievementIcon(icon) {
        if (typeof icon === "string" && icon.startsWith("data:")) {
            return `<img src="${icon}" style="width: 32px; height: 32px; object-fit: contain;" />`;
        } else if (typeof icon === "number" || (typeof icon === "string" && !isNaN(parseInt(icon)))) {
            const iconNumber = parseInt(icon);
            if (!isNaN(iconNumber)) {
                return `<img src="${load_preset(iconNumber + ".png")}" style="width: 32px; height: 32px; object-fit: contain;" />`;
            }
        }
        return `<div style="width: 32px; height: 32px; background: var(--primary); border-radius: 50%; display: flex; align-items: center; justify-content: center;">🏆</div>`;
    }

    // Setup search with debounce
    let searchTimeout = null;
    function setupSearch() {
        const searchInput = get_element("search-query");
        const countInput = get_element("search-count");
        const offsetInput = get_element("search-offset");

        const triggerSearch = () => {
            if (searchTimeout) clearTimeout(searchTimeout);
            searchTimeout = setTimeout(() => loadRooms(), 500);
        };

        if (searchInput) searchInput.addEventListener("input", triggerSearch);
        if (countInput) countInput.addEventListener("change", loadRooms);
        if (offsetInput) offsetInput.addEventListener("change", loadRooms);
    }

    // Escape HTML to prevent XSS
    function escapeHtml(text) {
        if (!text) return "";
        const div = document.createElement("div");
        div.textContent = text;
        return div.innerHTML;
    }

    // Load initial data and set up auto-refresh
    function init() {
        loadProfile();
        loadRooms();
        loadAchievements();
        setupSearch();

        // Auto-refresh rooms every 5 seconds
        if (roomsRefreshInterval) clearInterval(roomsRefreshInterval);
        roomsRefreshInterval = setInterval(() => loadRooms(), 5000);

        // Auto-refresh achievements every 30 seconds
        if (achievementsRefreshInterval) clearInterval(achievementsRefreshInterval);
        achievementsRefreshInterval = setInterval(() => loadAchievements(), 30000);
    }

    // Cleanup on page unload
    window.addEventListener("beforeunload", () => {
        if (roomsRefreshInterval) clearInterval(roomsRefreshInterval);
        if (achievementsRefreshInterval) clearInterval(achievementsRefreshInterval);
    });

    // Start the app when DOM is ready
    if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", init);
    } else {
        init();
    }
</script>
    </body>
</html>
